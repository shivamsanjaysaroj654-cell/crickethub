<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Cricket Hub</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========== TOAST CONTAINER ========== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ========== MODAL ========== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-close" id="modal-close">✕</div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- ========== LIVE SCORING OVERLAY ========== -->
  <div class="scoring-overlay" id="scoring-overlay">
    <div class="scoring-panel" id="scoring-panel"></div>
  </div>

  <!-- ========== LOADER ========== -->
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <div style="margin-top:1rem;font-weight:700;color:var(--text);letter-spacing:1px">LOADING ENGINE</div>
  </div>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar">
    <div class="nav-container">
      <div class="nav-brand" onclick="navigate('home')">
        <div class="nav-logo">🏏</div>
        <div>Cricket<span class="accent">Hub</span></div>
      </div>
      <div class="nav-links">
        <a href="#" class="nav-link" data-route="home" id="nav-home">Home</a>
        <a href="#" class="nav-link" data-route="players" id="nav-players">Players</a>
        <a href="#" class="nav-link" data-route="auction" id="nav-auction">Auction</a>
        <a href="#" class="nav-link" data-route="tournament" id="nav-tournament">Tournaments</a>
        <a href="#" class="nav-link" data-route="quickmatch" id="nav-quickmatch">Quick Match</a>
        <a href="#" class="nav-link" data-route="scores" id="nav-scores">
          Live Scores
          <div class="live-pill" id="live-pill">
            <div class="pulse-dot"></div><span id="live-count">0</span>
          </div>
        </a>
        <a href="#" class="nav-link" data-route="stats" id="nav-stats">Stats Hub</a>
      </div>
      <div class="hamburger" id="hamburger">☰</div>
    </div>
  </nav>

  <!-- ========== MOBILE NAV ========== -->
  <div class="mobile-nav" id="mobile-nav">
    <a href="#" class="mobile-nav-link" data-route="home">🏠 Home</a>
    <a href="#" class="mobile-nav-link" data-route="players">👤 Players</a>
    <a href="#" class="mobile-nav-link" data-route="auction">🔨 Auction</a>
    <a href="#" class="mobile-nav-link" data-route="tournament">🏆 Tournaments</a>
    <a href="#" class="mobile-nav-link" data-route="quickmatch">⚡ Quick Match</a>
    <a href="#" class="mobile-nav-link" data-route="scores">📊 Live Scores</a>
    <a href="#" class="mobile-nav-link" data-route="stats">📈 Stats Hub</a>
  </div>

  <!-- ========== MAIN CONTENT ========== -->
  <main class="main-content">
    <section id="section-home" class="section active"></section>
    <section id="section-players" class="section"></section>
    <section id="section-auction" class="section"></section>
    <section id="section-tournament" class="section"></section>
    <section id="section-quickmatch" class="section"></section>
    <section id="section-scores" class="section"></section>
    <section id="section-stats" class="section"></section>
  </main>

  <!-- ========== FIREBASE CONNECTION ========== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
    const firebaseConfig = {
      apiKey: "AIzaSyBTCoPO81upDrJrIchLlx3yRbDb32fNfIM",
      authDomain: "crickethub-8d128.firebaseapp.com",
      databaseURL: "https://crickethub-8d128-default-rtdb.firebaseio.com",
      projectId: "crickethub-8d128",
      storageBucket: "crickethub-8d128.firebasestorage.app",
      messagingSenderId: "104919674106",
      appId: "1:104919674106:web:a81427725c28d9d6382d43",
      measurementId: "G-0RHT3DYTE3"
    };

    const app = initializeApp(firebaseConfig);

    window.FirebaseDB = getDatabase(app);
    window.FirebaseRef = ref;
    window.FirebaseOnValue = onValue;
    window.FirebaseSet = set;

    window.FirebaseAuth = getAuth(app);
    window.FirebaseSignIn = signInWithEmailAndPassword;
    window.FirebaseSignUp = createUserWithEmailAndPassword;
    window.FirebaseOnAuth = onAuthStateChanged;
    window.FirebaseSignOut = signOut;
  </script>

  <script src="app.js" defer></script>
</body>

</html>
